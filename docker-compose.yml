services:
  urlshortner:
    image: ${DOCKER_REGISTRY-}urlshortner
    build:
      context: URLShortner
      dockerfile: Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    environment:
      - ConnectionStrings__MongoDb=urlshortner.database://${DB_USER}:${DB_PASSWORD}@mongodb:27017/${DB_DATABASE}?authSource=admin
    depends_on:
      urlshortner.database:
        condition: service_healthy
    restart: always

  urlshortner.database:
    image: mongo:latest
    container_name: urlshortner.database
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.containers/database:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
